name: Build and publish AAR

on:
  pull_request:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run library tests
        run: ./gradlew :WebForge:testReleaseUnitTest

      - name: Build obfuscated release AAR
        run: ./gradlew :WebForge:assembleRelease

      - name: Upload AAR and mapping
        uses: actions/upload-artifact@v4
        with:
          name: webforge-aar-${{ github.sha }}
          path: |
            WebForge/build/outputs/aar/*-release.aar
            WebForge/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Publish to GitHub Packages on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew :WebForge:publishReleasePublicationToGitHubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
